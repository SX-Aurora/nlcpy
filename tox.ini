[tox]
envlist =
    py312
distshare =
    {toxworkdir}/distshare

[testenv]
#wheel = true
skip_install = true
setenv =
    PYTHONPATH = ""
deps =
    cython
    wheel
    numpy==1.26.0
    pytest
    setuptools
allowlist_externals =
    /bin/bash
    sh
whitelist_externals =
    make
    sh
    rm
commands =
    /bin/bash -c 'rm -rf {toxworkdir}/dist/*'
    python {toxinidir}/setup.py bdist_wheel --targ vh --ncc-ver 5.4.1 --dist-dir {toxworkdir}/dist -p manylinux1_x86_64
    python {toxinidir}/setup.py bdist_wheel --targ ve1,ve3 --ncc-ver 5.4.1 --dist-dir {toxworkdir}/dist
    /bin/bash -c 'cd {toxworkdir} && ls {toxworkdir}/dist/* | xargs python -m pip install'
    sh run_pytest.sh {posargs}
    /bin/bash -c 'mkdir -p {toxworkdir}/distshare'
    /bin/bash -c 'cp {toxworkdir}/dist/* {toxworkdir}/distshare/'
passenv =
    VE_LD_LIBRARY_PATH
    VE_LIBRARY_PATH
    NCC_INCLUDE_PATH
    NFORT_INCLUDE_PATH
    VE_NODE_NUMBER
    NLC_HOME
    VE_NLCPY_NODELIST
